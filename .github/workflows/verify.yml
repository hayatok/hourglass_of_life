name: Verify life simulation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import editable project
        run: godot --headless --editor --import --path .
      - name: Simulate invitations, overnight schedules and save continuity
        run: godot --headless --path . --script tests/test_simulation.gd
      - name: Simulate promises, social history, habits and save migration
        run: godot --headless --path . --script tests/test_social_life.gd
      - name: Simulate work, household expenses, care handover and joint projects
        run: godot --headless --path . --script tests/test_work_family.gd
      - name: Boot the complete scene
        run: godot --headless --path . --quit-after 10
